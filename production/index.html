<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRODUCTION // VERTEXIUM</title>

    <!-- Google Fonts: Inter (Title), Share Tech Mono (Nav/Labels), Space Mono (Card Text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&family=Share+Tech+Mono&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3rem 8vw;
            background-color: #030205; /* Deep obsidian */
            color: #ffffff;
            font-family: 'Space Mono', monospace;
            position: relative;
            overflow-x: hidden;

            /* Muted ambient glow */
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(168, 85, 247, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(242, 227, 198, 0.05) 0%, transparent 45%);
        }

        /* Subtle Starfield Overlay */
        #stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            animation: sparkle 2.5s infinite ease-in-out;
        }

        /* Page Layout Container */
        .content-wrapper {
            z-index: 2;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
        }

        /* Top Bar Navigation */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Share Tech Mono', monospace;
            margin-bottom: 3.5rem; /* Space between nav and page title */
        }

        .back-link {
            color: #f2e3c6; /* Lighter Tan */
            text-decoration: none;
            font-size: 1rem;
            letter-spacing: 0.1em;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .back-link:hover {
            color: #c084fc; /* Purple */
            text-shadow: 0 0 10px rgba(192, 132, 252, 0.8);
            transform: translateX(-4px);
        }

        .page-tag {
            color: rgba(168, 85, 247, 0.7);
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        /* Title */
        .page-title {
            font-family: 'Inter', sans-serif;
            font-size: clamp(2rem, 4.5vw, 3.5rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #ffffff;
            margin-bottom: 2.5rem; /* Space between title and album grid */
            text-shadow: 
                0 0 16px rgba(242, 227, 198, 0.25),
                0 0 32px rgba(168, 85, 247, 0.35);
        }

        .player-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-top: 1rem;
        }

        .turntable-card, .library-card {
            background: rgba(10, 6, 18, 0.6);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 8px;
            padding: 2rem;
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .vinyl-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem 0;
        }

        .vinyl-disc {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle, #111 0%, #080808 40%, #1a1a1a 41%, #0d0d0d 70%, #000 100%);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9), 0 0 15px rgba(168, 85, 247, 0.15);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease;
        }

        .vinyl-disc.is-spinning {
            animation: spinVinyl 3s linear infinite;
        }

        @keyframes spinVinyl {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .vinyl-label-container {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            border: 2px solid #111;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #vinyl-label {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .spindle-hole {
            position: absolute;
            width: 14px;
            height: 14px;
            background-color: #030205;
            border: 2px solid rgba(242, 227, 198, 0.6);
            border-radius: 50%;
            z-index: 2;
        }

        .player-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(168, 85, 247, 0.15);
        }

        .now-playing-label {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.75rem;
            color: rgba(168, 85, 247, 0.8);
            letter-spacing: 0.1rem;
        }

        .track-title-display {
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            color: #ffffff;
            margin-top: 0.2rem;
        }

        .play-button {
            background: transparent;
            border: 1px solid #c084fc;
            color: #f2e3c6;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            padding: 0.6rem 1.4rem;
            border-radius: 4px;
            cursor: pointer;
            letter-spacing: 0.1em;
            transition: all 0.25s ease;
        }

        .play-button:hover {
            background: rgba(192, 132, 252, 0.2);
            color: #ffffff;
            box-shadow: 0 0 12px rgba(192, 132, 252, 0.5);
        }

        .library-header {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            color: rgba(242, 227, 198, 0.7);
            letter-spacing: 0.15em;
            margin-bottom: 1rem;
        }

        .track-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .track-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 1rem;
            border: 1px solid rgba(168, 85, 247, 0.1);
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .track-item:hover {
            border-color: rgba(192, 132, 252, 0.4);
            background: rgba(168, 85, 247, 0.08);
            transform: translateX(4px);
        }

        .track-item.active {
            border-color: #c084fc;
            background: rgba(168, 85, 247, 0.15);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.2);
        }

        .track-num {
            font-family: 'Share Tech Mono', monospace;
            color: rgba(168, 85, 247, 0.8);
            font-size: 0.85rem;
        }

        .track-details {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 0.85rem;
        }

        .track-name {
            color: #ffffff;
            font-weight: 700;
        }

        .track-time {
            font-family: 'Share Tech Mono', monospace;
            color: rgba(242, 227, 198, 0.5);
        }

        /* Footer */
        .footer {
            z-index: 2;
            margin-top: 5rem;
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            color: rgba(242, 227, 198, 0.4);
            display: flex;
            justify-content: flex-end;
            letter-spacing: 0.15em;
            border-top: 1px solid rgba(168, 85, 247, 0.15);
            padding-top: 1.5rem;
        }

        /* Star Sparkle Animation */
        @keyframes sparkle {
            0%, 100% {
                opacity: 0.15;
                transform: scale(0.6);
            }
            50% {
                opacity: 0.95;
                transform: scale(1.6);
                box-shadow: 0 0 8px rgba(242, 227, 198, 0.8);
            }
        }

        @media (max-width: 768px) {
            .player-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Stars Field -->
    <div id="stars"></div>

    <!-- Main Content Area -->
    <div class="content-wrapper">

        <!-- 1. Top Navigation Bar -->
        <nav class="top-nav">
            <a href="/" class="back-link">&lt;// return home</a>
            <span class="page-tag">05 // PRODUCTION</span>
        </nav>

        <!-- 2. Section Title -->
        <h1 class="page-title">PRODUCTION: songs made by me</h1>

        <!-- 3. Player Container (placed inside wrapper for consistent width) -->
        <div class="player-container">

            <!-- Record Player -->
            <div class="turntable-card">
                <div class="vinyl-wrapper">
                    <div class="vinyl-disc" id="vinyl">
                        <div class="vinyl-grooves"></div>
                        <div class="vinyl-label-container">
                            <img id="vinyl-label" src="covers/fade.png" alt="Album Cover">
                            <div class="spindle-hole"></div>
                        </div>
                    </div>
                </div>

                <div class="player-controls">
                    <div class="track-info">
                        <span class="now-playing-label">// NOW PLAYING </span>
                        <h3 id="now-playing-title" class="track-title-display">Fade</h3>
                    </div>
                    <button id="play-btn" class="play-button">PLAY</button>
                </div>

                <audio id="audio-player" src="audio/fade.mp3"></audio>
            </div>

            <!-- Track Library -->
            <div class="library-card">
                <h2 class="library-header">// TRACK LIBRARY</h2>
                <div class="track-list">

                    <!-- Item 1 -->
                    <div class="track-item active" data-src="audio/fade.mp3" data-cover="covers/fade.png" data-title="Fade">
                        <span class="track-num">01</span>
                        <div class="track-details"> 
                            <span class="track-name">Fade</span>
                            <span class="track-time">1:00</span>
                        </div>
                    </div>

                    <!-- Item 2 -->
                    <div class="track-item" data-src="audio/decay.mp3" data-cover="covers/decay.png" data-title="Decay">
                        <span class="track-num">02</span>
                        <div class="track-details">
                            <span class="track-name">Decay</span>
                            <span class="track-time">1:13</span>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <span>VERTEXIUM // 2026</span>
    </footer>

    <!-- Audio & Starfield Script -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const audioPlayer = document.getElementById('audio-player');
            const playBtn = document.getElementById('play-btn');
            const vinyl = document.getElementById('vinyl');
            const vinylLabel = document.getElementById('vinyl-label');
            const nowPlayingTitle = document.getElementById('now-playing-title');
            const trackItems = document.querySelectorAll('.track-item');

            let isPlaying = false;

            function togglePlay() {
                if (isPlaying) {
                    audioPlayer.pause();
                    vinyl.classList.remove('is-spinning');
                    playBtn.textContent = 'PLAY';
                    isPlaying = false;
                } else {
                    audioPlayer.play().then(() => {
                        vinyl.classList.add('is-spinning');
                        playBtn.textContent = 'PAUSE';
                        isPlaying = true;
                    }).catch(err => console.log("Audio playback error:", err));
                }
            }

            playBtn.addEventListener('click', togglePlay);

            trackItems.forEach(item => {
                item.addEventListener('click', function() {
                    trackItems.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');

                    const songSrc = this.getAttribute('data-src');
                    const coverSrc = this.getAttribute('data-cover');
                    const songTitle = this.getAttribute('data-title');

                    audioPlayer.src = songSrc;
                    vinylLabel.src = coverSrc;
                    nowPlayingTitle.textContent = songTitle;

                    isPlaying = false;
                    togglePlay();
                });
            });

            audioPlayer.addEventListener('ended', function() {
                vinyl.classList.remove('is-spinning');
                playBtn.textContent = 'PLAY';
                isPlaying = false;
            });

            generateStars();
        });

        function generateStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 60;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                
                const size = Math.random() > 0.7 ? 2 : 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}vw`;
                star.style.top = `${Math.random() * 100}vh`;
                star.style.animationDelay = `${Math.random() * 3}s`;
                star.style.animationDuration = `${1.5 + Math.random() * 2}s`;
                
                starsContainer.appendChild(star);
            }
        }
    </script>

</body>
</html>
