<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRODUCTION // VERTEXIUM</title>

    <!-- Google Fonts: Inter (Title), Share Tech Mono (Nav/Labels), Space Mono (Card Text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&family=Share+Tech+Mono&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3rem 8vw;
            background-color: #030205; /* Deep obsidian */
            color: #ffffff;
            font-family: 'Space Mono', monospace;
            position: relative;
            overflow-x: hidden;

            /* Muted ambient glow */
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(168, 85, 247, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(242, 227, 198, 0.05) 0%, transparent 45%);
        }

        /* Subtle Starfield Overlay */
        #stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            animation: sparkle 2.5s infinite ease-in-out;
        }

        /* Top Bar Navigation */
        .top-nav {
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Share Tech Mono', monospace;
            margin-bottom: 4rem;
        }

        .back-link {
            color: #f2e3c6; /* Lighter Tan */
            text-decoration: none;
            font-size: 1rem;
            letter-spacing: 0.1em;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .back-link:hover {
            color: #c084fc; /* Purple */
            text-shadow: 0 0 10px rgba(192, 132, 252, 0.8);
            transform: translateX(-4px);
        }

        .page-tag {
            color: rgba(168, 85, 247, 0.7);
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        /* Page Layout Container */
        .content-wrapper {
            z-index: 2;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
        }

        /* Clean Lowercase Title */
        .page-title {
            font-family: 'Inter', sans-serif;
            font-size: clamp(2rem, 4.5vw, 3.5rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #ffffff;
            margin-bottom: 2.5rem;
            text-shadow: 
                0 0 16px rgba(242, 227, 198, 0.25),
                0 0 32px rgba(168, 85, 247, 0.35);
        }

        /* 3x5 Album Grid */
        .album-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            width: 100%;
        }

        /* Album Card Component */
        .album-card {
            background: rgba(10, 6, 18, 0.6);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 6px;
            padding: 1rem;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            backdrop-filter: blur(8px);
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), 
                        border-color 0.3s ease, 
                        box-shadow 0.3s ease;
        }

        .album-cover-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #12091c;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(242, 227, 198, 0.1);
        }

        /* Full color & brightness by default */
        .album-cover-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: none;
            transition: filter 0.3s ease, transform 0.3s ease;
        }

        /* Card Text Info */
        .album-info {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .album-title {
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.3s ease;
        }

        .album-artist {
            color: #f2e3c6; /* Lighter Tan */
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.8rem;
            opacity: 0.85;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Hover Interaction Effects */
        .album-card:hover {
            transform: scale(1.03) translateY(-4px);
            border-color: rgba(242, 227, 198, 0.5);
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.8),
                0 0 20px rgba(168, 85, 247, 0.3);
        }

        .album-card:hover .album-cover-wrapper img {
            transform: scale(1.03);
            filter: brightness(1.08);
        }

        .album-card:hover .album-title {
            color: #c084fc; /* Purple Glow on Hover */
        }

        /* Footer */
        .footer {
            z-index: 2;
            margin-top: 5rem;
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            color: rgba(242, 227, 198, 0.4);
            display: flex;
            justify-content: flex-end;
            letter-spacing: 0.15em;
            border-top: 1px solid rgba(168, 85, 247, 0.15);
            padding-top: 1.5rem;
        }

        /* Star Sparkle Animation */
        @keyframes sparkle {
            0%, 100% {
                opacity: 0.15;
                transform: scale(0.6);
            }
            50% {
                opacity: 0.95;
                transform: scale(1.6);
                box-shadow: 0 0 8px rgba(242, 227, 198, 0.8);
            }
        }

        /* Responsive Breakpoints */
        @media (max-width: 850px) {
            .album-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 500px) {
            body { padding: 2rem 5vw; }
            .album-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Stars Field -->
    <div id="stars"></div>

    <!-- Navigation -->
    <nav class="top-nav">
        <a href="/" class="back-link">&lt;// return home</a>
        <span class="page-tag">04 // music</span>
    </nav>

    <!-- Main Content Area -->
    <div class="content-wrapper">
        <h1 class="page-title">music: my top 15 albums</h1>


    <!-- Footer -->
    <footer class="footer">
        <span>VERTEXIUM // 2026</span>
    </footer>

    <!-- stars -->
    <script>
        function generateStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 60;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                
                const size = Math.random() > 0.7 ? 2 : 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}vw`;
                star.style.top = `${Math.random() * 100}vh`;
                star.style.animationDelay = `${Math.random() * 3}s`;
                star.style.animationDuration = `${1.5 + Math.random() * 2}s`;
                
                starsContainer.appendChild(star);
            }
        }

        document.addEventListener("DOMContentLoaded", generateStars);
    </script>

</body>
</html>
