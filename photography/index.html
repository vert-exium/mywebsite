<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography // VERTEXIUM</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&family=Share+Tech+Mono&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3rem 8vw;
            background-color: #030205; /* Deep obsidian */
            color: #ffffff;
            font-family: 'Space Mono', monospace;
            position: relative;
            overflow-x: hidden;

            background-image: 
                radial-gradient(circle at 20% 30%, rgba(168, 85, 247, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(242, 227, 198, 0.05) 0%, transparent 45%);
        }

        /* Starfield Overlay */
        #stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            animation: sparkle 2.5s infinite ease-in-out;
        }

        /* Top Navigation */
        .top-nav {
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Share Tech Mono', monospace;
            margin-bottom: 3rem;
        }

        .back-link {
            color: #f2e3c6;
            text-decoration: none;
            font-size: 1rem;
            letter-spacing: 0.1em;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .back-link:hover {
            color: #c084fc;
            text-shadow: 0 0 10px rgba(192, 132, 252, 0.8);
            transform: translateX(-4px);
        }

        .page-tag {
            color: rgba(168, 85, 247, 0.7);
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .content-wrapper {
            z-index: 2;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        /* Header Section */
        .header-section {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-bottom: 3.5rem;
        }

        .page-title {
            font-family: 'Inter', sans-serif;
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #ffffff;
            text-shadow: 
                0 0 16px rgba(242, 227, 198, 0.25),
                0 0 32px rgba(168, 85, 247, 0.35);
        }

        .portfolio-banner {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(168, 85, 247, 0.08);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 8px;
            padding: 0.75rem 1.25rem;
            width: fit-content;
            text-decoration: none;
            color: #f2e3c6;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .portfolio-banner span {
            color: #c084fc;
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .portfolio-banner:hover {
            background: rgba(168, 85, 247, 0.18);
            border-color: rgba(242, 227, 198, 0.6);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.35);
            transform: translateY(-2px);
        }

        /* Grid Layout for Albums */
        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            width: 100%;
        }

        .album-card {
            text-decoration: none;
            color: inherit;
            background: rgba(10, 6, 18, 0.6);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.35s ease;
            position: relative;
            backdrop-filter: blur(8px);
        }

        .album-card:hover {
            border-color: rgba(242, 227, 198, 0.6);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.35);
            transform: translateY(-6px);
        }

        .card-image-wrapper {
            width: 100%;
            height: 380px;
            overflow: hidden;
            position: relative;
        }

        .card-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transition: transform 0.5s ease, filter 0.3s ease;
        }

        .album-card:hover .card-image-wrapper img {
            transform: scale(1.05);
        }

        .card-info {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            background: rgba(10, 6, 18, 0.85);
            border-top: 1px solid rgba(168, 85, 247, 0.15);
        }

        .album-title {
            font-family: 'Inter', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.01em;
            transition: color 0.25s ease;
        }

        .album-card:hover .album-title {
            color: #f2e3c6;
        }

        .album-meta {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.85rem;
            color: #c084fc;
            letter-spacing: 0.1em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .arrow-icon {
            font-size: 1.2rem;
            transition: transform 0.25s ease;
        }

        .album-card:hover .arrow-icon {
            transform: translateX(4px);
            color: #f2e3c6;
        }

        .footer {
            z-index: 2;
            margin-top: 5rem;
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            color: rgba(242, 227, 198, 0.4);
            display: flex;
            justify-content: flex-end;
            letter-spacing: 0.15em;
            border-top: 1px solid rgba(168, 85, 247, 0.15);
            padding-top: 1.5rem;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0.15; transform: scale(0.6); }
            50% { opacity: 0.95; transform: scale(1.6); box-shadow: 0 0 8px rgba(242, 227, 198, 0.8); }
        }
    </style>
</head>
<body>

    <!-- Stars Field -->
    <div id="stars"></div>

    <!-- Navigation -->
    <nav class="top-nav">
        <a href="/" class="back-link">&lt;// back to home</a>
        <span class="page-tag">hub // photography</span>
    </nav>

    <!-- Main Content -->
    <div class="content-wrapper">
        <div class="header-section">
            <h1 class="page-title">Photography</h1>
            
            <!-- Portfolio External Link -->
            <a href="https://vertexphotos.myportfolio.com" target="_blank" rel="noopener noreferrer" class="portfolio-banner">
                <span>all albums at vertexphotos.myportfolio.com</span>
                <span class="external-icon">↗</span>
            </a>
        </div>

        <!-- Album Cards Grid -->
        <main class="album-grid">
            
            <!-- San Francisco #1 Card -->
            <a href="albums/sfone/index.html" class="album-card">
                <div class="card-image-wrapper">
                    <img src="IMG_2260.jpg" alt="San Francisco #1 Cover">
                </div>
                <div class="card-info">
                    <div class="album-meta">
                        <span>53 PHOTOS</span>
                        <span class="arrow-icon">→</span>
                    </div>
                    <h2 class="album-title">San Francisco #1</h2>
                </div>
            </a>

            <!-- Fleet Week 2024 Card -->
            <a href="albums/fleetweek24/index.html" class="album-card">
                <div class="card-image-wrapper">
                    <img src="IMG_7903.jpg" alt="Fleet Week 2024 Cover">
                </div>
                <div class="card-info">
                    <div class="album-meta">
                        <span>16 PHOTOS</span>
                        <span class="arrow-icon">→</span>
                    </div>
                    <h2 class="album-title">Fleet Week 2024</h2>
                </div>
            </a>

        </main>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <span>VERTEXIUM // 2026</span>
    </footer>

    <!-- Interactive Scripts -->
    <script>
        function generateStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 60; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() > 0.7 ? 2 : 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}vw`;
                star.style.top = `${Math.random() * 100}vh`;
                star.style.animationDelay = `${Math.random() * 3}s`;
                star.style.animationDuration = `${1.5 + Math.random() * 2}s`;
                starsContainer.appendChild(star);
            }
        }

        document.addEventListener("DOMContentLoaded", generateStars);
    </script>

</body>
</html>
