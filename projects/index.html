<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects // VERTEXIUM</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&family=Share+Tech+Mono&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3rem 8vw;
            background-color: #030205; /* Deep obsidian */
            color: #ffffff;
            font-family: 'Space Mono', monospace;
            position: relative;
            overflow-x: hidden;

            background-image: 
                radial-gradient(circle at 20% 30%, rgba(168, 85, 247, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(242, 227, 198, 0.05) 0%, transparent 45%);
        }

        /* Starfield Overlay */
        #stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            animation: sparkle 2.5s infinite ease-in-out;
        }

        /* Top Navigation */
        .top-nav {
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Share Tech Mono', monospace;
            margin-bottom: 3rem;
        }

        .back-link {
            color: #f2e3c6;
            text-decoration: none;
            font-size: 1rem;
            letter-spacing: 0.1em;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .back-link:hover {
            color: #c084fc;
            text-shadow: 0 0 10px rgba(192, 132, 252, 0.8);
            transform: translateX(-4px);
        }

        .page-tag {
            color: rgba(168, 85, 247, 0.7);
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .content-wrapper {
            z-index: 2;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        /* Header Section */
        .header-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 3.5rem;
        }

        .page-title {
            font-family: 'Inter', sans-serif;
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #ffffff;
            text-shadow: 
                0 0 16px rgba(242, 227, 198, 0.25),
                0 0 32px rgba(168, 85, 247, 0.35);
        }

        /* Status Badge */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(168, 85, 247, 0.08);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 20px;
            padding: 0.5rem 1.1rem;
            width: fit-content;
            color: #f2e3c6;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            backdrop-filter: blur(8px);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #c084fc;
            box-shadow: 0 0 8px #c084fc;
            animation: pulse 1.8s infinite;
        }

        /* Generic Coming Soon Container */
        .coming-soon-card {
            background: rgba(10, 6, 18, 0.65);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 16px;
            padding: 3.5rem 2.5rem;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .coming-soon-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #c084fc, #f2e3c6, transparent);
        }

        .card-headline {
            font-family: 'Inter', sans-serif;
            font-size: clamp(1.8rem, 3.5vw, 2.5rem);
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 1.2rem;
            letter-spacing: -0.01em;
        }

        .card-body {
            color: rgba(242, 227, 198, 0.8);
            font-size: 1rem;
            line-height: 1.8;
            margin-bottom: 2rem;
        }

        .terminal-block {
            background: rgba(3, 2, 5, 0.85);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 8px;
            padding: 1.25rem 1.5rem;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            color: #c084fc;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background-color: #f2e3c6;
            animation: blink 1s infinite;
        }

        .footer {
            z-index: 2;
            margin-top: 5rem;
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            color: rgba(242, 227, 198, 0.4);
            display: flex;
            justify-content: flex-end;
            letter-spacing: 0.15em;
            border-top: 1px solid rgba(168, 85, 247, 0.15);
            padding-top: 1.5rem;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0.15; transform: scale(0.6); }
            50% { opacity: 0.95; transform: scale(1.6); box-shadow: 0 0 8px rgba(242, 227, 198, 0.8); }
        }

        @keyframes pulse {
            0% { opacity: 0.4; box-shadow: 0 0 2px #c084fc; }
            50% { opacity: 1; box-shadow: 0 0 10px #c084fc; }
            100% { opacity: 0.4; box-shadow: 0 0 2px #c084fc; }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Stars Field -->
    <div id="stars"></div>

    <!-- Navigation -->
    <nav class="top-nav">
        <a href="../index.html" class="back-link">&lt;// back to home</a>
        <span class="page-tag">hub // projects</span>
    </nav>

    <!-- Main Content -->
    <div class="content-wrapper">
        <div class="header-section">
            <h1 class="page-title">Projects</h1>
            

        </div>

        <!-- Generic Coming Soon Section -->
        <main class="coming-soon-card">f
            <h2 class="card-headline">Coming Soon</h2>
            <p class="card-body">
                This area is currently being built out. Projects, documentation, and releases will appear here once ready.
            </p>

            <div class="terminal-block">
                <span>&gt; status --check</span>
                <span class="cursor"></span>
            </div>
        </main>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <span>VERTEXIUM // 2026</span>
    </footer>

    <!-- Interactive Scripts -->
    <script>
        function generateStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 60; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() > 0.7 ? 2 : 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}vw`;
                star.style.top = `${Math.random() * 100}vh`;
                star.style.animationDelay = `${Math.random() * 3}s`;
                star.style.animationDuration = `${1.5 + Math.random() * 2}s`;
                starsContainer.appendChild(star);
            }
        }

        document.addEventListener("DOMContentLoaded", generateStars);
    </script>

</body>
</html>
